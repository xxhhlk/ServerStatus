services:
  serverstatus-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: cppla/serverstatus:client
    container_name: serverstatus-client
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      serverstatus_SERVER: "${serverstatus_SERVER:-127.0.0.1}"
      # 注意：USER 会被 docker compose 在宿主机环境中先插值。
      # 如果运行时没有显式传递，或传递方式不正确，可能会被 Docker/系统环境中的 $USER
      # 替换成本机用户名，而不是期望的默认 s01。
      # 推荐优先级：运行程序时显式传递 USER > 用户修改这里的 USER 默认值 > Docker/系统环境。
      serverstatus_USER: "${serverstatus_USER:-s01}"
      serverstatus_PORT: "${serverstatus_PORT:-35601}"
      serverstatus_PASSWORD: "${serverstatus_PASSWORD:-USER_DEFAULT_PASSWORD}"
      serverstatus_INTERVAL: "${serverstatus_INTERVAL:-1}"
      serverstatus_PROBEPORT: "${serverstatus_PROBEPORT:-80}"
      serverstatus_PROBE_PROTOCOL_PREFER: "${serverstatus_PROBE_PROTOCOL_PREFER:-ipv4}"
      serverstatus_PING_PACKET_HISTORY_LEN: "${serverstatus_PING_PACKET_HISTORY_LEN:-100}"
      serverstatus_CU: "${serverstatus_CU:-cu.tz.cloudcpp.com}"
      serverstatus_CT: "${serverstatus_CT:-ct.tz.cloudcpp.com}"
      serverstatus_CM: "${serverstatus_CM:-cm.tz.cloudcpp.com}"
      CLIENT: "${CLIENT:-psutil}"
